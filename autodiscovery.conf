# Cryptotherm Miner Auto-Discovery — Configuration
# Copy to autodiscovery.conf and customize per host.
#
# SECURITY: never commit a real platform_token — this repository is PUBLIC.
# A live token was previously committed here and in autodiscovery.py; it must
# be rotated on the platform. Environment variables (CT_PLATFORM_TOKEN etc.)
# override these values.

[discovery]
platform_api   = http://20.125.62.35:8080
platform_token = REPLACE_ME
printer_ip     = 10.0.0.119
subnet         = 10.0.0
scan_interval  = 30

[print]
# Host that has brother_ql installed — prints via SSH if not local
print_host     = 10.0.0.248
print_user     = ctadmin
print_via_ssh  = true
# Set to false if running on the Mac with brother_ql installed
label_model    = QL-810W
label_size     = 62

[logging]
log_file       = /var/log/ct_autodiscovery.log
log_level      = INFO

[thresholds]
warmup_wait_min   = 10
fail_if_no_hash_after_min = 20
min_accepted_for_pass = 1
