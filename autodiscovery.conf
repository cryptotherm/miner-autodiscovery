# Cryptotherm Miner Auto-Discovery — Configuration
# Copy to autodiscovery.conf and customize per host

[discovery]
platform_api   = http://20.125.62.35:8080
platform_token = xk_T_zkKCiJ0irn8gBK6csrztp7rsNzKPcefXbVCxWc
printer_ip     = 10.0.0.119
subnet         = 10.0.0
scan_interval  = 30
# Pool URL substrings we operate. A miner whose primary pool matches none of
# these is flagged pool_known=false so the GUI can prompt for tagging
# (in-testing pool vs. a site). Leave empty to disable the check.
# Example: known_pools = stratum.braiins.com, btc.luxor.tech, ct-testing
known_pools    =
# Firmware families allowed on outgoing units: stock, braiins, luxos.
# Anything else (e.g. vnish on incoming units) is flagged needs_reflash.
approved_firmware = stock, braiins, luxos

[print]
# Host that has brother_ql installed — prints via SSH if not local
print_host     = 10.0.0.248
print_user     = ctadmin
print_ssh_port = 22
print_via_ssh  = true
# Set to false if running on the Mac with brother_ql installed
label_model    = QL-810W
label_size     = 62

[logging]
log_file       = /var/log/ct_autodiscovery.log
log_level      = INFO

[thresholds]
warmup_wait_min   = 10
fail_if_no_hash_after_min = 20
min_accepted_for_pass = 1
